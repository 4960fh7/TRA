<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台鐵列車分析</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        #history-app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 90vh;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            background-color: #060a12;
            color: #e2e8f0;
        }
        .date-selector-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            background: #0d1b2a;
            border: 1px solid #162238;
            border-radius: 4px;
        }
        .date-input {
            background: #060a12;
            border: 1px solid #00f0ff;
            color: #fff;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.2);
            border-radius: 2px;
        }
        .fetch-btn {
            background: #162238;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.2);
            transition: all 0.2s;
            border-radius: 2px;
            font-weight: bold;
        }
        .fetch-btn:hover {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            background: #00f0ff;
            color: #060a12;
        }
        .chart-container {
            width: 100%;
            height: 400px;
            margin-bottom: 30px;
            background: rgba(13, 21, 38, 0.8);
            border: 1px solid #162238;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 4px;
            position: relative;
        }
        .chart-title {
            color: #00f0ff;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.2rem;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-title-group">
            <h1>台鐵列車分析</h1>
        </div>
        <div class="search-wrap">
            <button onclick="window.location.href='index.html'" class="reset-btn">列車動態</button>
        </div>
    </div>

    <div id="history-app-container">
        <div class="date-selector-container">
            <label for="date-input" style="font-weight: bold; color: #d0ffe6;">選擇日期 (MMDD):</label>
            <input type="text" id="date-input" class="date-input" placeholder="例如: 0601">
            <button id="fetch-btn" class="fetch-btn">查詢</button>
        </div>
        <div id="charts-wrapper"></div>
    </div>

    <script src="history.js"></script>
</body>

</html>
