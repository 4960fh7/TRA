<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>臺鐵誤點分析</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        #history-app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 90vh;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            background-color: #060a12;
            color: #e2e8f0;
        }

        .date-input {
            background: #060a12;
            border: 1px solid #00f0ff;
            color: #fff;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.2);
            border-radius: 2px;
        }

        .fetch-btn {
            background: #162238;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.2);
            transition: all 0.2s;
            border-radius: 2px;
            font-weight: bold;
        }

        .fetch-btn:hover {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            background: #00f0ff;
            color: #060a12;
        }

        .chart-container {
            width: 100%;
            height: 400px;
            min-height: 400px;
            flex-shrink: 0;
            margin-bottom: 30px;
            background: rgba(13, 21, 38, 0.8);
            border: 1px solid #162238;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 4px;
            position: relative;
        }

        .chart-title {
            color: #00f0ff;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.2rem;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .hamburger-btn { display: none; background: none; border: none; color: #d0ffe6; font-size: 24px; cursor: pointer; padding: 8px; z-index: 1100; }
        .nav-overlay { display: none; position: fixed; top: 0; right: 0; width: 100%; height: 100%; z-index: 1050; }
        .nav-overlay .nav-backdrop { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .nav-overlay .nav-drawer { position: absolute; top: 0; right: 0; width: 220px; height: 100%; background: #0d1b2a; border-left: 1px solid #1a2a3a; display: flex; flex-direction: column; padding: 60px 20px 20px 20px; gap: 10px; }
        .nav-overlay .nav-drawer .nav-link { display: block; background: #111a22; border: 1px solid #1a2a3a; color: #fff; padding: 12px 16px; font-family: inherit; font-size: 15px; cursor: pointer; border-radius: 5px; text-align: left; transition: 0.2s; }
        .nav-overlay .nav-drawer .nav-link:hover { border-color: #00f0ff; color: #00f0ff; }
        .nav-overlay .nav-drawer .nav-link.active { border-color: #00f0ff; color: #00f0ff; background: #14283f; }
        .nav-overlay.open { display: block; }
        @media (max-width: 600px) {
            .hamburger-btn { display: block; }
            .desktop-nav-btn { display: none !important; }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-title-group">
            <h1>臺鐵誤點分析</h1>
        </div>
        <div class="search-wrap">
            <button id="view-mode-btn" class="fetch-btn" style="margin-right: 15px; padding: 6px 12px; background: #00f0ff; color: #060a12;">切換至: 各車站</button>
            
            <button onclick="window.location.href='index.html'" class="reset-btn desktop-nav-btn">列車動態</button>
            <button onclick="window.location.href='planner.html'" class="reset-btn desktop-nav-btn">旅程規劃</button>
            <button id="mobile-search-toggle" class="fetch-btn mobile-only" style="margin-left: 10px;">搜尋設定 ▼</button>
            <button class="hamburger-btn" id="hamburger-btn">☰</button>

            <div id="mobile-search-form" class="mobile-search-form">
                <label for="date-input" style="font-weight: bold; color: #d0ffe6; font-size: 14px;">日期:</label>
                <input type="date" id="date-input" class="date-input" style="padding: 6px 10px;">
                <button id="fetch-btn" class="fetch-btn" style="padding: 6px 12px; margin-right: 10px;">查詢</button>

                <label id="search-label" for="train-search-input" style="font-weight: bold; color: #d0ffe6; font-size: 14px;">搜尋:</label>
                <div style="position: relative; width: 100%;">
                    <input type="text" id="train-search-input" class="date-input" placeholder="搜尋車站或車次" autocomplete="off"
                        style="width: 160px; padding: 6px 10px;">
                    <div id="train-suggestions" class="suggestions-dropdown custom-scrollbar" style="width: 300px;"></div>
                </div>
                <button id="search-btn" class="fetch-btn" style="padding: 6px 12px; margin-right: 10px;">跳轉</button>
            </div>
        </div>
    </div>

    <!-- Mobile Nav Overlay -->
    <div class="nav-overlay" id="nav-overlay">
        <div class="nav-backdrop" id="nav-backdrop"></div>
        <div class="nav-drawer">
            <button class="nav-link" onclick="window.location.href='index.html'">列車動態</button>
            <button class="nav-link" onclick="window.location.href='planner.html'">旅程規劃</button>
            <button class="nav-link active">歷史資料</button>
        </div>
    </div>
    <script>
        document.getElementById('hamburger-btn').addEventListener('click', function() { document.getElementById('nav-overlay').classList.toggle('open'); });
        document.getElementById('nav-backdrop').addEventListener('click', function() { document.getElementById('nav-overlay').classList.remove('open'); });
    </script>

    <div id="history-app-container" class="custom-scrollbar">

        <div class="chart-container" id="overview-chart-container" style="display: none;">
            <h2 class="chart-title">所有列車總覽</h2>
            <div style="position: relative; height: calc(100% - 40px); width: 100%;">
                <canvas id="overview-canvas"></canvas>
            </div>
        </div>

        <div id="charts-wrapper"></div>
    </div>

    <script>
        document.getElementById('mobile-search-toggle').addEventListener('click', function() {
            var form = document.getElementById('mobile-search-form');
            form.classList.toggle('show');
            if (form.classList.contains('show')) {
                this.innerHTML = '搜尋設定 ▲';
            } else {
                this.innerHTML = '搜尋設定 ▼';
            }
        });
    </script>
    <script src="history.js"></script>
</body>

</html>
