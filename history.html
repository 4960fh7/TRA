<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>臺鐵誤點分析</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <style>
        #history-app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: calc(90vh - 60px);
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            background-color: #060a12;
            color: #e2e8f0;
        }

        .sub-header {
            display: flex;
            align-items: center;
            background: #060a12;
            border-bottom: 1px dashed #d0ffe6;
            padding: 10px 30px;
            gap: 10px;
            flex-wrap: wrap;
        }

        #back-to-top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background: #00f0ff;
            color: #060a12;
            border: none;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: all 0.3s;
        }

        #back-to-top-btn:hover {
            background: #d0ffe6;
            box-shadow: 0 0 20px rgba(0, 240, 255, 1);
        }

        @media (max-width: 600px) {
            .sub-header {
                display: none;
                position: absolute;
                top: 60px;
                left: 0;
                right: 0;
                background: rgba(6, 10, 18, 0.95);
                backdrop-filter: blur(5px);
                z-index: 1050;
                padding: 15px;
                flex-direction: column;
                align-items: flex-start;
                border-bottom: 1px solid #00f0ff;
            }

            .sub-header.show {
                display: flex;
            }

            #history-app-container {
                height: calc(90vh);
            }

            .chart-container {
                padding: 6px !important;
                margin-bottom: 10px !important;
                height: var(--mobile-height, 140px) !important;
                min-height: var(--mobile-height, 140px) !important;
                aspect-ratio: auto !important;
            }

            .chart-title {
                font-size: 0.9rem !important;
                margin-bottom: 2px !important;
                margin-top: 2px !important;
            }

            #overview-chart-container,
            #avg-delay-bar-chart {
                height: 300px !important;
                min-height: 300px !important;
            }

            #charts-wrapper {
                padding-bottom: 200px;
            }
        }

        .date-input {
            background: #060a12;
            border: 1px solid #00f0ff;
            color: #fff;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.2);
            border-radius: 2px;
        }

        .fetch-btn {
            background: #162238;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.2);
            transition: all 0.2s;
            border-radius: 2px;
            font-weight: bold;
        }

        @media (hover: hover) {
            .fetch-btn:hover {
                box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
                background: #00f0ff;
                color: #060a12;
            }
        }

        .chart-container {
            width: 100%;
            height: 400px;
            min-height: 400px;
            flex-shrink: 0;
            margin-bottom: 30px;
            background: rgba(13, 21, 38, 0.8);
            border: 1px solid #162238;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 4px;
            position: relative;
        }

        .chart-title {
            color: #00f0ff;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.2rem;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }


        /* --- Map View Modal Styles --- */
        #map-view-modal {
            display: none;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a1120 0%, #060a12 100%);
            flex-direction: column;
        }

        #map-view-modal.show {
            display: flex;
        }

        #map-container {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .map-time-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: rgba(6, 10, 18, 0.95);
            border-top: 1px solid #00f0ff;
            flex-wrap: wrap;
        }

        .time-slider {
            flex: 1;
            min-width: 200px;
            max-width: 600px;
            accent-color: #00f0ff;
        }

        .time-display {
            font-size: 1.2rem;
            color: #00f0ff;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }

        .close-map-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(13, 21, 38, 0.8);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 1010;
            font-weight: bold;
        }

        .close-map-btn:hover {
            background: #ef4444;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-title-group">
            <h1>臺鐵誤點分析</h1>
        </div>
        <div class="search-wrap">
            <button onclick="window.location.href='index.html'" class="reset-btn desktop-nav-btn">列車動態</button>
            <button onclick="window.location.href='planner.html'" class="reset-btn desktop-nav-btn">旅程規劃</button>
            <button id="mobile-search-toggle" class="fetch-btn mobile-only" style="margin-left: 10px;">搜尋設定 ▼</button>
            <button class="hamburger-btn" id="hamburger-btn">☰</button>
        </div>
    </div>

    <div class="sub-header" id="mobile-search-form">
        <div style="display: flex; align-items: center; gap: 10px; margin-right: 15px;">
            <button id="close-map-btn" class="fetch-btn"
                style="display: none; padding: 6px 12px; white-space: nowrap;">返回誤點圖表</button>
            <button id="view-mode-btn" class="fetch-btn" style="padding: 6px 12px; white-space: nowrap;">切換至：
                各車站</button>
            <button id="delay-map-btn" class="fetch-btn" style="padding: 6px 12px; white-space: nowrap;">誤點區間地圖</button>
        </div>
        <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap; flex: 1;">
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <label style="font-weight: bold; color: #d0ffe6; font-size: 14px; white-space: nowrap;">日期：</label>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <input type="date" id="start-date-input" class="date-input responsive-date" style="padding: 6px 8px; width: 130px;">
                    <span style="color: #d0ffe6;">~</span>
                    <input type="date" id="end-date-input" class="date-input responsive-date" style="padding: 6px 8px; width: 130px;">
                </div>
                <button id="fetch-btn" class="fetch-btn" style="padding: 6px 12px; white-space: nowrap;">查詢</button>
            </div>

            <div
                style="display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; flex: 1 1 auto; max-width: 100%;">
                <label id="search-label" for="train-search-input"
                    style="font-weight: bold; color: #d0ffe6; font-size: 14px; white-space: nowrap; flex-shrink: 0;">搜尋：</label>
                <div style="position: relative; flex: 1 1 auto; max-width: 300px; min-width: 160px;">
                    <input type="text" id="train-search-input" class="date-input" placeholder="搜尋車站或車次"
                        autocomplete="off" style="width: 100%; padding: 6px 10px; box-sizing: border-box;">
                    <div id="train-suggestions" class="suggestions-dropdown custom-scrollbar"
                        style="width: 100%; top: 100%; box-sizing: border-box;"></div>
                </div>
                <button id="search-btn" class="fetch-btn"
                    style="padding: 6px 12px; white-space: nowrap; flex-shrink: 0;">跳轉</button>
            </div>
        </div>
    </div>

    <!-- Mobile Nav Overlay -->
    <div class="nav-overlay" id="nav-overlay">
        <div class="nav-backdrop" id="nav-backdrop"></div>
        <div class="nav-drawer">
            <button class="nav-link" onclick="window.location.href='index.html'">列車動態</button>
            <button class="nav-link" onclick="window.location.href='planner.html'">旅程規劃</button>
            <button class="nav-link active">歷史資料</button>
        </div>
    </div>
    <script>
        document.getElementById('hamburger-btn').addEventListener('click', function () { document.getElementById('nav-overlay').classList.toggle('open'); });
        document.getElementById('nav-backdrop').addEventListener('click', function () { document.getElementById('nav-overlay').classList.remove('open'); });
    </script>



    <div id="history-app-container" class="custom-scrollbar">

        <div id="charts-main-content" style="width: 100%;">
            <div class="chart-container" id="overview-chart-container" style="display: none;">
                <h2 class="chart-title">所有列車總覽</h2>
                <div style="position: relative; height: calc(100% - 40px); width: 100%;">
                    <canvas id="overview-canvas"></canvas>
                </div>
            </div>

            <div id="charts-wrapper"></div>
        </div>

        <!-- Map View Modal -->
        <div id="map-view-modal">
            <div id="map-container">
                <svg id="history-map-svg" style="width: 100%; height: 100%;"></svg>
                <div id="history-tooltip" class="tooltip"></div>
            </div>
            <div class="map-time-controls">
                <button id="play-pause-btn" class="fetch-btn" style="width: 40px; padding: 6px;"
                    title="播放/暫停">▶️</button>
                <button id="reset-time-btn" class="fetch-btn" style="width: 40px; padding: 6px;"
                    title="重設時間">🔄</button>
                <button id="loop-btn" class="fetch-btn" style="width: 40px; padding: 6px; opacity: 0.5;"
                    title="循環播放">🔁</button>
                <div style="position: relative; display: inline-block;">
                    <button id="speed-btn" class="fetch-btn" style="width: 50px; padding: 6px; font-weight: bold;"
                        title="播放速度">⏩</button>
                    <div id="speed-menu"
                        style="display: none; position: absolute; bottom: 100%; left: 0; background-color: rgba(13, 21, 38, 0.95); border: 1px solid rgba(208, 255, 230, 0.2); border-radius: 4px; padding: 5px; margin-bottom: 5px; flex-direction: column; gap: 5px; z-index: 2000;">
                        <button class="fetch-btn speed-option" data-speed="8"
                            style="width: 40px; padding: 4px;">8x</button>
                        <button class="fetch-btn speed-option" data-speed="4"
                            style="width: 40px; padding: 4px;">4x</button>
                        <button class="fetch-btn speed-option" data-speed="2"
                            style="width: 40px; padding: 4px;">2x</button>
                        <button class="fetch-btn speed-option" data-speed="1"
                            style="width: 40px; padding: 4px; background-color: rgba(208, 255, 230, 0.2);">1x</button>
                        <button class="fetch-btn speed-option" data-speed="0.5"
                            style="width: 40px; padding: 4px;">0.5x</button>
                    </div>
                </div>
                <div class="time-display" id="date-display" style="font-size: 1rem; margin-right: -10px;"></div>
                <div class="time-display" id="time-display">05:00</div>
                <input type="range" id="time-slider" class="time-slider" min="300" max="1500" step="5" value="300">
            </div>
        </div>
    </div>

    <button id="back-to-top-btn" title="回頂端">↑</button>

    <script>
        document.getElementById('mobile-search-toggle').addEventListener('click', function () {
            var form = document.getElementById('mobile-search-form');
            form.classList.toggle('show');
            if (form.classList.contains('show')) {
                this.innerHTML = '搜尋設定 ▲';
            } else {
                this.innerHTML = '搜尋設定 ▼';
            }
        });

        const appContainer = document.getElementById('history-app-container');
        const backToTopBtn = document.getElementById('back-to-top-btn');

        appContainer.addEventListener('scroll', () => {
            if (appContainer.scrollTop > 300) {
                backToTopBtn.style.display = 'flex';
            } else {
                backToTopBtn.style.display = 'none';
            }
        });

        backToTopBtn.addEventListener('click', () => {
            appContainer.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
    <script src="history.js"></script>
</body>

</html>
