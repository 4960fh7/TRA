<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>臺鐵列車動態</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>

</head>

<body>
    <script src="icons.js"></script>
    <div class="header">
        <div class="header-title-group">
            <h1>臺鐵列車動態</h1>
        </div>
        <div class="search-wrap">
            <button id="reset-widths-btn" class="reset-btn" style="display: none;" title="重設面板寬度" aria-label="重設面板寬度"><svg class="pi" aria-hidden="true"><use href="#pi-rotate-ccw"/></svg></button>
            <button onclick="window.location.href='planner.html'" class="reset-btn desktop-nav-btn"><svg class="pi" aria-hidden="true"><use href="#pi-route"/></svg>旅程規劃</button>
            <button onclick="window.location.href='history.html'" class="reset-btn desktop-nav-btn"><svg class="pi" aria-hidden="true"><use href="#pi-chart-line"/></svg>誤點紀錄</button>
            <div class="search-container">
                <svg class="pi search-icon" aria-hidden="true"><use href="#pi-search"/></svg>
                <input type="text" id="unified-search-input" placeholder="搜尋車站或車次編號..." autocomplete="off">
                <div id="unified-suggestions" class="suggestions-dropdown custom-scrollbar"></div>
            </div>
            <button class="hamburger-btn" id="hamburger-btn" aria-label="選單"><svg class="pi" aria-hidden="true"><use href="#pi-menu"/></svg></button>
        </div>
    </div>

    <!-- Mobile Nav Overlay -->
    <div class="nav-overlay" id="nav-overlay">
        <div class="nav-backdrop" id="nav-backdrop"></div>
        <div class="nav-drawer">
            <button class="nav-link active"><svg class="pi" aria-hidden="true"><use href="#pi-train-front"/></svg>列車動態</button>
            <button class="nav-link" onclick="window.location.href='planner.html'"><svg class="pi" aria-hidden="true"><use href="#pi-route"/></svg>旅程規劃</button>
            <button class="nav-link" onclick="window.location.href='history.html'"><svg class="pi" aria-hidden="true"><use href="#pi-chart-line"/></svg>誤點紀錄</button>
        </div>
    </div>
    <script>
        document.getElementById('hamburger-btn').addEventListener('click', function () { document.getElementById('nav-overlay').classList.toggle('open'); });
        document.getElementById('nav-backdrop').addEventListener('click', function () { document.getElementById('nav-overlay').classList.remove('open'); });
    </script>

    <div id="tooltip" class="tooltip"></div>

    <div id="app-container">
        <div id="map-container">
            <button id="overview-toggle-btn" class="topology-toggle-btn overview-mobile-btn"
                onclick="toggleOverviewPanel()"><svg class="pi" aria-hidden="true"><use href="#pi-list"/></svg>顯示總覽</button>
            <button id="topology-toggle-btn" class="topology-toggle-btn" onclick="toggleTopologyMode()"><svg class="pi" aria-hidden="true"><use href="#pi-network"/></svg>切換拓樸圖</button>
            <button id="home-view-btn" class="topology-toggle-btn icon-only" style="left: 160px; display: none;" title="回到預設視角" aria-label="回到預設視角"><svg class="pi" aria-hidden="true"><use href="#pi-house"/></svg></button>
            <div id="map"></div>
        </div>

        <div id="overview-panel">
            <div id="overview-panel-meta-container">
                <div id="overview-details">
                    <h2>誤點總覽</h2>
                    <p id="overview-update-time">最後更新：載入中...</p>
                </div>
                <div class="overview-header-actions">
                    <div id="close-overview-btn" class="close-btn overview-mobile-btn" onclick="toggleOverviewPanel()"
                        role="button" aria-label="關閉"><svg class="pi" aria-hidden="true"><use href="#pi-x"/></svg></div>
                </div>
            </div>
            <hr>
            <div id="overview-content" class="custom-scrollbar">
                <p class="placeholder-text">讀取中...</p>
            </div>
        </div>

        <div id="info-panel">
            <div id="info-panel-meta-container">
                <div id="station-details"></div>
                <div class="info-panel-header-actions">
                    <div class="view-toggle" role="group" aria-label="顯示方式">
                        <button type="button" class="view-toggle-btn active" data-view="cards" title="卡片列表"
                            aria-label="卡片列表"><svg class="pi" aria-hidden="true"><use href="#pi-layout-grid"/></svg></button>
                        <button type="button" class="view-toggle-btn" data-view="board" title="翻牌時刻表"
                            aria-label="翻牌時刻表"><svg class="pi" aria-hidden="true"><use href="#pi-rows-4"/></svg></button>
                    </div>
                    <div id="close-panel-btn" class="close-btn" role="button" aria-label="關閉"><svg class="pi" aria-hidden="true"><use href="#pi-x"/></svg></div>
                </div>
            </div>

            <hr>

            <div id="unified-train-wrapper">
                <div class="sticky-direction-header">
                    <div class="dir-indicator ccw-ind">逆行</div>
                    <div class="dir-indicator cw-ind">順行</div>
                </div>
                <div id="unified-train-list" class="custom-scrollbar">
                    <p class="placeholder-text">選擇車站以顯示資訊...</p>
                </div>
            </div>

            <!-- Split-flap departure board (built by flapboard.js) -->
            <div id="flapboard-wrapper" class="custom-scrollbar"></div>
        </div>

        <div id="schedule-panel">
            <div id="schedule-panel-meta-container">
                <div id="train-details">
                    <h2 id="schedule-train-title">列車停靠站</h2>
                    <p id="schedule-train-route">請點擊班次...</p>
                </div>
                <div class="schedule-panel-header-actions">
                    <div id="close-schedule-btn" class="close-btn" role="button" aria-label="關閉"><svg class="pi" aria-hidden="true"><use href="#pi-x"/></svg></div>
                </div>
            </div>
            <hr>
            <div id="schedule-stops-container" class="custom-scrollbar">
                <p class="placeholder-text">選擇列車以顯示停靠站...</p>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
    <script src="flapboard.js"></script>
</body>

</html>
