<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taiwan TRA Stations Map</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
</head>
<body>
    <div class="header">
        <h1>Taiwan TRA Stations</h1>
        <p>Hover over the circles to see the station names. Click to view daily schedules.</p>
        
        <div class="search-container">
            <input type="text" id="station-search-input" placeholder="Search station name (e.g., 臺北, 高雄)..." autocomplete="off">
            <div id="search-suggestions" class="suggestions-dropdown"></div>
        </div>
    </div>
    
    <div id="tooltip" class="tooltip"></div>

    <div id="app-container">
        <div id="map-container">
            <div id="map"></div>
        </div>
        
        <div id="info-panel">
            <div id="close-panel-btn" class="close-btn">&times; Close Panel</div>
            <div id="station-details">
                </div>
            <hr>
            
            <div class="train-split-layout">
                <div class="train-column">
                    <div class="column-header counter-clockwise-header">逆行</div>
                    <div id="train-list-ccw" class="train-list-container">
                        <p class="placeholder-text">Select a station...</p>
                    </div>
                </div>
                
                <div class="train-column">
                    <div class="column-header clockwise-header">順行</div>
                    <div id="train-list-cw" class="train-list-container">
                        <p class="placeholder-text">Select a station...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
