<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taiwan TRA Stations Map</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
</head>
<body>
    <div class="header">
        <div class="header-title-group">
            <h1>臺鐵列車動態</h1>
        </div>
        <div class="search-container">
            <input type="text" id="station-search-input" placeholder="搜尋車站（例：臺北、高雄）..." autocomplete="off">
            <div id="search-suggestions" class="suggestions-dropdown"></div>
        </div>
    </div>
    
    <div id="tooltip" class="tooltip"></div>

    <div id="app-container">
        <div id="map-container">
            <div id="map"></div>
        </div>
        
        <div id="info-panel">
            <div id="info-panel-meta-container">
                <div class="info-panel-header-actions">
                    <div id="close-panel-btn" class="close-btn">&times; 關閉</div>
                </div>
                <div id="station-details"></div>
                <hr>
            </div>
            
            <div id="unified-train-wrapper">
                <div class="sticky-direction-header">
                    <div class="dir-indicator ccw-ind">逆行</div>
                    <div class="dir-indicator cw-ind">順行</div>
                </div>
                <div id="unified-train-list">
                    <p class="placeholder-text">Select a station to load schedule information.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
