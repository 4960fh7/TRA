<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>臺鐵旅程規劃</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Planner specific styles */
        #planner-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            padding: 20px;
            box-sizing: border-box;
            gap: 20px;
            overflow-y: auto;
            align-items: center;
        }

        .planner-panel {
            background: #111a22;
            border-radius: 10px;
            border: 1px solid #1a2a3a;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }

        .planner-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .form-group {
            flex: 1;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 14px;
            font-family: inherit;
        }

        .planner-input {
            width: 100%;
            padding: 10px;
            background: #060a12;
            border: 1px solid #1a2a3a;
            color: #00f0ff;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: inherit;
        }

        .swap-btn {
            background: #1a2a3a;
            border: none;
            color: #00f0ff;
            cursor: pointer;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            height: 40px;
            width: 40px;
            margin-top: 22px;
        }

        .swap-btn:hover {
            background: #00f0ff;
            color: #060a12;
        }

        .submit-btn {
            background: #00f0ff;
            color: #060a12;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #00b0ff;
        }

        .settings-btn {
            background: #1a2a3a;
            color: #ccc;
            border: 1px solid #1a2a3a;
            padding: 10px;
            font-size: 14px;
            font-family: inherit;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
        }

        .settings-btn:hover {
            border-color: #00f0ff;
            color: #00f0ff;
        }

        .settings-panel {
            display: none;
            background: #0a1520;
            border: 1px solid #1a2a3a;
            border-radius: 5px;
            padding: 15px;
            margin-top: -5px;
        }

        .settings-panel.active {
            display: block;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            color: #ccc;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-option input[type="checkbox"] {
            accent-color: #00f0ff;
        }

        .filter-option label {
            cursor: pointer;
            margin: 0;
        }

        .filter-station-input {
            width: 100%;
            padding: 6px 10px;
            background: #060a12;
            border: 1px solid #1a2a3a;
            color: #00f0ff;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
            margin-top: 4px;
        }

        .results-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-card {
            background: #111a22;
            border: 1px solid #1a2a3a;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .result-card:hover {
            border-color: #00f0ff;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .time-info {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .duration-info {
            color: #ccc;
            font-size: 14px;
        }

        .transfer-info {
            font-size: 14px;
            color: #00f0ff;
        }

        .delay-text {
            color: #ff4444;
            margin-left: 5px;
            font-size: 14px;
        }

        .strikethrough {
            text-decoration: line-through;
            color: #888;
        }

        .timeline {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #1a2a3a;
        }
        
        .result-card.expanded .timeline {
            display: block;
        }

        /* Suggestions dropdown */
        .suggestions-dropdown-planner {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #0a111a;
            border: 1px solid #00f0ff;
            border-radius: 0 0 5px 5px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .suggestions-dropdown-planner.active {
            display: block;
        }
        
        .suggestion-item-planner {
            padding: 10px;
            cursor: pointer;
            color: #eee;
            border-bottom: 1px solid #1a2a3a;
            font-family: inherit;
        }

        .suggestion-item-planner:hover {
            background: #1a2a3a;
            color: #00f0ff;
        }

        .loading-text {
            text-align: center;
            color: #00f0ff;
            padding: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* Hamburger menu */
        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            color: #d0ffe6;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            z-index: 1100;
        }

        .nav-overlay {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            z-index: 1050;
        }

        .nav-overlay .nav-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .nav-overlay .nav-drawer {
            position: absolute;
            top: 0;
            right: 0;
            width: 220px;
            height: 100%;
            background: #0d1b2a;
            border-left: 1px solid #1a2a3a;
            display: flex;
            flex-direction: column;
            padding: 60px 20px 20px 20px;
            gap: 10px;
        }

        .nav-overlay .nav-drawer .nav-link {
            display: block;
            background: #111a22;
            border: 1px solid #1a2a3a;
            color: #fff;
            padding: 12px 16px;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            border-radius: 5px;
            text-align: left;
            transition: 0.2s;
        }

        .nav-overlay .nav-drawer .nav-link:hover {
            border-color: #00f0ff;
            color: #00f0ff;
        }

        .nav-overlay .nav-drawer .nav-link.active {
            border-color: #00f0ff;
            color: #00f0ff;
            background: #14283f;
        }

        .nav-overlay.open {
            display: block;
        }

        /* Desktop: show nav buttons, hide hamburger */
        .desktop-nav-btn {
            /* shown by default */
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                align-items: stretch;
            }
            .form-row.station-row {
                flex-direction: column;
            }
            .form-row.datetime-row {
                flex-direction: row;
            }
            .swap-btn {
                transform: rotate(90deg);
                align-self: center;
                margin-top: 0;
            }
            .hamburger-btn {
                display: block;
            }
            .desktop-nav-btn {
                display: none !important;
            }
            #planner-container {
                padding: 15px;
                height: calc(100vh - 50px);
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-title-group">
            <h1>臺鐵旅程規劃</h1>
        </div>
        <div class="search-wrap">
            <button onclick="window.location.href='index.html'" class="reset-btn desktop-nav-btn">即時動態</button>
            <button onclick="window.location.href='history.html'" class="reset-btn desktop-nav-btn">歷史資料</button>
            <button class="hamburger-btn" id="hamburger-btn">☰</button>
        </div>
    </div>

    <!-- Mobile Nav Overlay -->
    <div class="nav-overlay" id="nav-overlay">
        <div class="nav-backdrop" id="nav-backdrop"></div>
        <div class="nav-drawer">
            <button class="nav-link" onclick="window.location.href='index.html'">列車動態</button>
            <button class="nav-link active">旅程規劃</button>
            <button class="nav-link" onclick="window.location.href='history.html'">歷史資料</button>
        </div>
    </div>

    <div id="planner-container" class="custom-scrollbar">
        <div class="planner-panel">
            <div class="planner-form">
                <div class="form-row station-row">
                    <div class="form-group">
                        <label for="from-station">出發站</label>
                        <input type="text" id="from-station" class="planner-input" placeholder="例如: 台北" autocomplete="off">
                        <div id="from-suggestions" class="suggestions-dropdown-planner custom-scrollbar"></div>
                    </div>
                    <button class="swap-btn" id="swap-stations-btn" title="對調起訖站">⇄</button>
                    <div class="form-group">
                        <label for="to-station">抵達站</label>
                        <input type="text" id="to-station" class="planner-input" placeholder="例如: 高雄" autocomplete="off">
                        <div id="to-suggestions" class="suggestions-dropdown-planner custom-scrollbar"></div>
                    </div>
                </div>
                
                <div class="form-row datetime-row">
                    <div class="form-group">
                        <label for="travel-date">日期</label>
                        <input type="date" id="travel-date" class="planner-input">
                    </div>
                    <div class="form-group">
                        <label for="travel-time">時間</label>
                        <input type="time" id="travel-time" class="planner-input" step="60">
                    </div>
                </div>

                <button class="settings-btn" id="settings-toggle-btn">⚙ 篩選設定</button>
                <div class="settings-panel" id="settings-panel">
                    <div class="filter-option">
                        <input type="checkbox" id="filter-direct-only">
                        <label for="filter-direct-only">僅顯示直達車</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="filter-eticket">
                        <label for="filter-eticket">電子票證（不含新自強、太魯閣、普悠瑪）</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="filter-reserved">
                        <label for="filter-reserved">對號列車（不含區間、區間快）</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="filter-unreserved">
                        <label for="filter-unreserved">非對號列車（僅含區間、區間快）</label>
                    </div>
                    <div class="filter-option" style="flex-direction: column; align-items: flex-start;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="filter-transfer-station">
                            <label for="filter-transfer-station">指定轉乘站</label>
                        </div>
                        <input type="text" id="filter-transfer-station-input" class="filter-station-input" placeholder="輸入轉乘站名稱" autocomplete="off" disabled>
                        <div id="filter-transfer-suggestions" class="suggestions-dropdown-planner custom-scrollbar" style="position: relative; top: 0;"></div>
                    </div>
                </div>

                <button id="search-plan-btn" class="submit-btn">規劃旅程</button>
            </div>
        </div>

        <div id="results-container" class="results-container">
            <div style="text-align: center; color: #888; padding: 20px;">請輸入條件並點擊「規劃旅程」</div>
        </div>
    </div>

    <script>
        // Hamburger menu toggle
        document.getElementById('hamburger-btn').addEventListener('click', function() {
            document.getElementById('nav-overlay').classList.toggle('open');
        });
        document.getElementById('nav-backdrop').addEventListener('click', function() {
            document.getElementById('nav-overlay').classList.remove('open');
        });

        // Settings panel toggle
        document.getElementById('settings-toggle-btn').addEventListener('click', function() {
            document.getElementById('settings-panel').classList.toggle('active');
        });

        // Reserved / unreserved mutual exclusion
        document.getElementById('filter-reserved').addEventListener('change', function() {
            if (this.checked) document.getElementById('filter-unreserved').checked = false;
        });
        document.getElementById('filter-unreserved').addEventListener('change', function() {
            if (this.checked) document.getElementById('filter-reserved').checked = false;
        });

        // Transfer station checkbox enables/disables input
        document.getElementById('filter-transfer-station').addEventListener('change', function() {
            document.getElementById('filter-transfer-station-input').disabled = !this.checked;
        });
    </script>
    <script src="planner.js"></script>
</body>
</html>
